[package]
name = "mypanel3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "mypanel3 — multi-protocol proxy management panel (master + node agent) in a single binary"

[[bin]]
name = "mypanel3"
path = "src/main.rs"

[dependencies]
mypanel-panel.workspace = true
mypanel-agent.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true
rand.workspace = true

[workspace]
resolver = "2"
members = [".", "crates/proto", "crates/panel", "crates/agent"]

[workspace.package]
version = "4.0.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
mypanel-proto = { path = "crates/proto" }
mypanel-panel = { path = "crates/panel" }
mypanel-agent = { path = "crates/agent" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "process", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace", "set-header", "limit", "timeout", "request-id", "sensitive-headers"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono", "json", "rust_decimal"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
totp-rs = { version = "5.7", features = ["otpauth"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }
hex = "0.4"
aes-gcm = "0.10"
bcrypt = "0.16"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rust-embed = { version = "8", features = ["interpolate-folder-path", "include-exclude"] }
mime_guess = "2"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
url = "2"
percent-encoding = "2"
validator = { version = "0.19", features = ["derive"] }
regex = "1"
once_cell = "1"
dashmap = "6"
cron = "0.15"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
subtle = "2"
ipnet = "2"

# gRPC client for Xray HandlerService / StatsService
tonic = { version = "0.14", default-features = false, features = ["router", "channel", "codegen", "tls-ring"] }
tonic-prost = "0.14"
prost = "0.14"

# mTLS (pinned to ring to avoid aws-lc-sys/cmake)
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
rustls-pemfile = "2.2"
x509-parser = { version = "0.18", features = ["verify"] }

# Subscription SRR & Happ encryption
age = { version = "0.12", features = ["armor"] }
rsa = "0.9"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }

# OpenAPI + Scalar UI
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
utoipa-scalar = { version = "0.4", features = ["axum"] }

# Passkeys / WebAuthn
webauthn-rs = { version = "0.6", features = ["resident-key-support", "conditional-ui"] }

# Redis Streams event export
redis = { version = "1", default-features = false, features = ["tokio-comp", "streams"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[profile.dev.package."*"]
opt-level = 1
