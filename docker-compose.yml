# mypanel3 — panel + PostgreSQL + Caddy (no Redis; the panel is a single
# binary + PostgreSQL). Copy .env.example to .env and fill it in first:
#   cp .env.example .env && $EDITOR .env
# Then:  docker compose up -d
# Admin: docker compose exec mypanel3 mypanel3 admin create --username admin --if-missing

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mypanel3
      POSTGRES_USER: mypanel3
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mypanel3 -d mypanel3"]
      interval: 5s
      timeout: 3s
      retries: 12

  mypanel3:
    build: .
    image: mypanel3:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://mypanel3:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/mypanel3
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      API_URL: https://${PANEL_DOMAIN:?PANEL_DOMAIN must be set in .env}
      TRUST_PROXY: "true"
      DATA_DIR: /var/lib/mypanel3
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - backups:/var/lib/mypanel3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - mypanel3
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:?PANEL_DOMAIN must be set in .env}
      PANEL_UPSTREAM: mypanel3:3000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  backups:
  caddy_data:
  caddy_config:
